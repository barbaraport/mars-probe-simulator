services:
  prometheus:
    image: prom/prometheus
    restart: "always"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ../.observability-data/${ENV}/prometheus:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    restart: "always"
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_USER_PASSWORD}
    depends_on:
      - prometheus
    volumes:
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - ../.observability-data/${ENV}/grafana:/var/lib/grafana

  jaeger:
    image: jaegertracing/jaeger
    restart: "always"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    volumes:
      - ../.observability-data/${ENV}/jaeger/data:/badger/data
      - ../.observability-data/${ENV}/jaeger/key:/badger/key

  dd-agent:
    image: registry.datadoghq.com/agent:7
    container_name: dd-agent
    restart: "always"
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: "datadoghq.com"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_INJECTION: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /opt/datadog-agent/run:/opt/datadog-agent/run:rw
    ports:
      - "8126:8126"
      - "8125:8125/udp"
